name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: zig version
      - name: Restore Zig cache
        uses: actions/cache@v4
        with:
          path: |
            .zig-cache
            zig-out
          key: zig-${{ runner.os }}-lint-${{ hashFiles('build.zig', 'build.zig.zon', 'tools/lint/**', 'src/**', 'apps/**', 'tests/**') }}
          restore-keys: |
            zig-${{ runner.os }}-lint-
      - name: Format check
        run: zig build fmt-check
      - name: Lint (strict / naming / imports / docs / unused / mirror / testing-allocator)
        run: zig build lint

  test:
    name: Test (${{ matrix.os }}, ${{ matrix.mode }})
    runs-on: ${{ matrix.os }}
    # The VM is pure computation, but the CLI is not: include
    # resolution, the manifest loader, the build cache and `gero init`
    # all reach std.fs. Compiling for a target says nothing about how
    # those behave on it, so Linux carries every release mode and the
    # other two hosts carry Debug — enough to catch a path, line-ending
    # or case-sensitivity divergence without quadrupling the matrix.
    strategy:
      fail-fast: false
      matrix:
        # Pull requests run the two fast cells; pushes to `main` run
        # all four. ReleaseSafe / ReleaseFast cold-build 111 separate
        # test binaries through LLVM on a 2-core runner — 16-20 min
        # each against ~1 min for Debug — so keeping them off the PR
        # path takes review feedback from ~20 min to ~4 while every
        # mode still gates `main` on merge.
        mode: ${{ github.event_name == 'pull_request' && fromJSON('["Debug","ReleaseSmall"]') || fromJSON('["Debug","ReleaseSafe","ReleaseFast","ReleaseSmall"]') }}
        os: [ubuntu-latest]
        # macOS and Windows run Debug only. A release-mode difference
        # that is also OS-specific is not a shape this codebase can
        # produce — the modes differ in optimization, the hosts differ
        # in filesystem behaviour, and Debug exercises the second.
        include:
          - os: macos-latest
            mode: Debug
          - os: windows-latest
            mode: Debug
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Restore Zig cache
        uses: actions/cache@v4
        with:
          path: |
            .zig-cache
            zig-out
          # One cache slot per release mode — each optimization level
          # produces distinct artifacts that can't share the cache.
          key: zig-${{ runner.os }}-test-${{ matrix.mode }}-${{ hashFiles('build.zig', 'build.zig.zon', 'src/**', 'apps/**', 'tests/**') }}
          restore-keys: |
            zig-${{ runner.os }}-test-${{ matrix.mode }}-
      # `install` builds the CLI (`zig-out/bin/gero`); `test` builds +
      # runs the test artifacts. Chaining in one invocation amortizes
      # the build-graph evaluation cost across both targets.
      - name: Build + test
        run: zig build install test -Doptimize=${{ matrix.mode }} -freference-trace

  cross-targets:
    name: Cross-target compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Restore Zig cache
        uses: actions/cache@v4
        with:
          path: |
            .zig-cache
            zig-out
          key: zig-${{ runner.os }}-cross-${{ hashFiles('build.zig', 'build.zig.zon', 'src/**', 'apps/**', 'tests/**') }}
          restore-keys: |
            zig-${{ runner.os }}-cross-
      - name: test-all (compile-only on extra targets)
        run: zig build test-all -freference-trace

  examples:
    name: Example integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Restore Zig cache
        uses: actions/cache@v4
        with:
          path: |
            .zig-cache
            zig-out
          # `examples` runs with the default (Debug) build, so share
          # the cache slot with the Debug test cell.
          key: zig-${{ runner.os }}-test-Debug-${{ hashFiles('build.zig', 'build.zig.zon', 'src/**', 'apps/**', 'tests/**', 'tools/**') }}
          restore-keys: |
            zig-${{ runner.os }}-test-Debug-
            zig-${{ runner.os }}-examples-
      - name: check-examples (parse + codegen-validate each example)
        run: zig build check-examples -freference-trace
      - name: check-broken (assert intentionally-bad fixtures fail)
        run: zig build check-broken -freference-trace
      - name: fmt-check-examples (every example is canonical)
        run: zig build fmt-check-examples -freference-trace
      - name: check-examples-gr (.gr examples fmt-clean + type-check)
        run: zig build check-examples-gr -freference-trace
      - name: test-examples (assemble + run + diff + round-trip each example)
        run: zig build test-examples -freference-trace
      - name: test-examples-lang (compile + run + diff each .gr example)
        run: zig build test-examples-lang -freference-trace
      - name: golden (emitted bytecode matches the blessed corpus)
        run: zig build golden -freference-trace
      - name: test-wasm-examples (every example runs under wasm32, not just compiles)
        run: zig build test-wasm-examples -freference-trace
